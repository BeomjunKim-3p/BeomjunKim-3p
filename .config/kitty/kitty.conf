# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# 1. 폰트 및 글자 크기 설정 (13.0으로 설정 후 작으면 14.5 ~ 15.0으로 조절)
font_family      D2KodingLigature Nerd Font Propo
font_size        16.0

# 2. 붙여넣기 편의성 개선 (Shift+Insert 지원 및 보안 경고창 자동 정리)
map shift+insert paste_from_clipboard
map enter send_text all \r
map backspace send_text all \x7f

# 1. 경고창은 원래대로 계속 뜨게 유지
paste_actions quote-urls-at-prompt,confirm,filter

hide_window_decorations yes

close_on_child_death yes
confirm_os_window_close 0

# 모든 Nerd Font 아이콘 영역을 Symbols Nerd Font Mono로 고정 매핑␍
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# -----------------------------------------------------------------------------
# Custom Tab Bar
# -----------------------------------------------------------------------------

tab_bar_edge bottom
tab_bar_style custom
tab_bar_align left

tab_bar_background #1e1e2e

tab_bar_margin_width 0
tab_bar_margin_height 0 0

tab_bar_show_new_tab_button no

restore_session_after_logout yes

allow_remote_control socket-only
listen_on unix:/tmp/mykitty
