set -g mouse on
# Prefix + r 누르면 설정 파일 새로고침
bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g status-left-length 50
set -g status-right-length 50

# 💡 [수정] tmux 트루컬러 세팅 (RGB 및 Tc 모두 호환되도록 지정)
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:RGB,xterm-256color:Tc"

# -----------------------------------------------------------------------------
# Catppuccin Tmux Theme (Mocha)
# -----------------------------------------------------------------------------
# TPM(Tmux Plugin Manager)을 사용하는 경우 플러그인 추가
set -g @plugin 'catppuccin/tmux#v2.1.2' # 최신 버전에 맞춰 모듈 적용
set -g @catppuccin_flavor 'mocha'      # mocha, macchiato, frappe, latte 선택 가능

# 기본 테마 설정만 손수 넣고 싶다면 아래 공식 테마 스크립트 연결도 가능합니다.


# Pane 테두리에 이름 표시 활성화
set -g pane-border-status top
set -g pane-border-format " [ #P: #{pane_title} ] "

# -----------------------------------------------------------------------------
# Window 탭 상태바 포맷 직접 지정 (Catppuccin Mocha 색상 적용)
# -----------------------------------------------------------------------------

# 비활 탭: Window 이름(#W)만 표시
set -g @catppuccin_window_text " #W"

# 활성 탭: Window 이름(#W)과 Pane 타이틀(#{pane_title}) 표시
#set -g @catppuccin_window_current_text " #W: #{pane_title}"

# 활성 탭: Pane 타이틀 표시
set -g @catppuccin_window_current_text " #{pane_title}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -gq allow-passthrough on

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
